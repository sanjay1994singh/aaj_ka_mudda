<!doctype html>
<html lang="hi">
<head>
    <meta charset="utf-8">
    <title>{{ news.title }} | आज का मुद्दा</title>
    <link rel="canonical" href="{{ canonical_url }}">
    <meta name="description" content="{{ meta_description }}">
    <meta property="og:locale" content="hi_IN">
    <meta property="og:type" content="article">
    <meta property="og:site_name" content="Aaj Ka Mudda">
    <meta property="og:title" content="{{ news.title }}">
    <meta property="og:description" content="{{ meta_description }}">
    <meta property="og:url" content="{{ canonical_url }}">
    {% if thumbnail_url %}
    <meta property="og:image" content="{{ thumbnail_url }}">
    <meta property="og:image:url" content="{{ thumbnail_url }}">
    <meta property="og:image:secure_url" content="{{ thumbnail_url }}">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="{{ news.title }}">
    {% endif %}
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{{ news.title }}">
    <meta name="twitter:description" content="{{ meta_description }}">
    {% if thumbnail_url %}
    <meta name="twitter:image" content="{{ thumbnail_url }}">
    <meta name="twitter:image:alt" content="{{ news.title }}">
    {% endif %}
    <meta http-equiv="refresh" content="0;url={{ canonical_url }}">
    <script>
        window.location.replace("{{ canonical_url|escapejs }}");
    </script>
</head>
<body>
    <p><a href="{{ canonical_url }}">खबर पढ़ें</a></p>
</body>
</html>
